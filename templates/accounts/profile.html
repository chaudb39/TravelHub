{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="card shadow">

        <div class="card-body">

            <h2>

            Hồ sơ cá nhân

            </h2>

            <hr>

            <p>

            <b>Tên đăng nhập:</b>

            {{ user.username }}

            </p>

            <p>

            <b>Email:</b>

            {{ user.email }}

            </p>

            <p>

            <b>Ngày tham gia:</b>

            {{ user.date_joined }}

            </p>

            <a
            href="{% url 'accounts:change_password' %}"
            class="btn btn-warning">

            Đổi mật khẩu

            </a>

        </div>

    </div>

</div>

{% endblock %}
