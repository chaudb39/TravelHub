{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow">

<div class="card-body">

<h2 class="text-center mb-4">
Đăng nhập
</h2>

<form method="post">

{% csrf_token %}

<div class="mb-3">

<label>Tên đăng nhập</label>

<input
type="text"
name="username"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Mật khẩu</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<button class="btn btn-success w-100">

Đăng nhập

</button>

</form>

<div class="text-center mt-3">

Chưa có tài khoản?

<a href="{% url 'accounts:register' %}">

Đăng ký

</a>

</div>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
