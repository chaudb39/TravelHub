{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="text-center mb-4">
                        Đăng ký tài khoản
                    </h2>

                    <form method="post">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button class="btn btn-primary w-100">
                            Đăng ký
                        </button>

                    </form>

                    <div class="text-center mt-3">

                        Đã có tài khoản?

                        <a href="{% url 'accounts:login' %}">
                            Đăng nhập
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
