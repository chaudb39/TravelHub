{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

<h1 class="mb-4">
Tin tức du lịch
</h1>

<div class="row">

{% for item in articles %}

<div class="col-md-6 mb-4">

<div class="card h-100">

<div class="card-body">

<h5>

<a
href="{{ item.link }}"
target="_blank">

{{ item.title }}

</a>

</h5>

<p>

{{ item.summary|safe|truncatewords:25 }}

</p>

</div>

</div>

</div>

{% endfor %}

</div>

</div>

{% endblock %}
